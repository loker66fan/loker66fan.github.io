<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#1a1a2e">
    <title>404 - 页面未找到</title>
    <link rel="stylesheet" href="./vendor/fontawesome/css/all.min.css">
    <link rel="icon" href="./favicon.ico">
    <style>
        @font-face { font-family:"MiSans"; font-style:normal; font-weight:400; font-display:swap; src:url('./font/MiSans-Regular.subset.woff2') format('woff2'); }

        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: 'MiSans', -apple-system, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        #app {
            text-align: center;
            padding: 40px 20px;
            animation: fadeUp 0.6s ease;
        }

        @keyframes fadeUp {
            from { opacity:0; transform:translateY(30px); }
            to { opacity:1; transform:translateY(0); }
        }

        @keyframes float {
            0%,100% { transform:translateY(0); }
            50% { transform:translateY(-12px); }
        }

        @keyframes pulse {
            0%,100% { opacity:0.3; }
            50% { opacity:0.6; }
        }

        .error-code {
            font-size: 8rem;
            font-weight: 800;
            line-height: 1;
            background: linear-gradient(135deg, #6366f1, #a855f7, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
            letter-spacing: -2px;
        }

        .error-icon {
            font-size: 3.5rem;
            margin-bottom: 16px;
            color: #6366f1;
            animation: float 3s ease-in-out infinite;
        }

        .error-title {
            font-size: 1.6rem;
            font-weight: 600;
            margin-bottom: 10px;
            color: rgba(255,255,255,0.9);
        }

        .error-desc {
            font-size: 1rem;
            color: rgba(255,255,255,0.5);
            margin-bottom: 32px;
            line-height: 1.7;
        }

        .error-suggestion {
            font-size: 0.88rem;
            color: rgba(255,255,255,0.4);
            margin-bottom: 28px;
            padding: 12px 20px;
            background: rgba(255,255,255,0.04);
            border-radius: 10px;
            display: inline-block;
            border: 1px solid rgba(255,255,255,0.06);
        }

        .error-actions {
            display: flex;
            gap: 14px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            padding: 12px 28px;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 500;
            border: none;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s;
            font-family: inherit;
        }

        .btn-primary {
            background: linear-gradient(135deg, #6366f1, #a855f7);
            color: #fff;
            box-shadow: 0 8px 32px rgba(99,102,241,0.35);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 40px rgba(99,102,241,0.5);
        }

        .btn-outline {
            background: rgba(255,255,255,0.06);
            color: rgba(255,255,255,0.8);
            border: 1px solid rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
        }

        .btn-outline:hover {
            background: rgba(255,255,255,0.12);
            border-color: rgba(255,255,255,0.2);
        }

        .particles {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: -1;
        }

        .particle {
            position: absolute;
            border-radius: 50%;
            background: rgba(99,102,241,0.15);
            animation: pulse 4s ease-in-out infinite;
        }

        .footer-text {
            margin-top: 40px;
            font-size: 0.78rem;
            color: rgba(255,255,255,0.3);
        }

        .footer-text a {
            color: rgba(255,255,255,0.5);
            text-decoration: none;
            transition: color 0.25s;
        }

        .footer-text a:hover { color: #a78bfa; }
    </style>
</head>
<body>
<div class="particles">
    <div class="particle" style="width:200px;height:200px;top:10%;left:5%;animation-delay:0s;"></div>
    <div class="particle" style="width:120px;height:120px;top:60%;right:10%;animation-delay:1s;"></div>
    <div class="particle" style="width:80px;height:80px;top:30%;right:25%;animation-delay:2s;"></div>
    <div class="particle" style="width:150px;height:150px;bottom:15%;left:20%;animation-delay:3s;"></div>
</div>

<div id="app">
    <div class="error-icon"><i class="fa-solid fa-circle-exclamation"></i></div>
    <div class="error-code">404</div>
    <div class="error-title">页面未找到</div>
    <div class="error-desc">
        抱歉，您访问的页面不存在或已被移除。<br />
        请确认链接为 <strong>loker66fan.top</strong> 下的有效地址。
    </div>
    <div class="error-suggestion">
        <i class="fa-solid fa-lightbulb"></i>&nbsp; 提示：试试返回主页，或者检查 URL 是否正确
    </div>
    <div class="error-actions">
        <a href="./index.html" class="btn btn-primary">
            <i class="fa-solid fa-house"></i> 返回主页
        </a>
        <a href="javascript:history.back()" class="btn btn-outline">
            <i class="fa-solid fa-arrow-left"></i> 返回上一页
        </a>
    </div>
    <div class="footer-text">
        &copy; 2022 - <span id="year"></span> <a href="http://www.loker66fan.top">loker|fan</a>
        &nbsp;·&nbsp; Modified from <a href="https://github.com/imsyy/home" target="_blank">imsyy</a>
    </div>
</div>

<script>
    document.getElementById('year').textContent = new Date().getFullYear();
</script>
</body>
</html>
